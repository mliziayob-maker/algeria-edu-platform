<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 أكاديمية أمين - الرئيسية</title>
    <link rel="stylesheet" href="css/main-style.css">
    <link rel="stylesheet" href="css/responsive-style.css">
</head>
<body>
    <div id="app">
        <!-- الهيدر -->
        <header class="main-header">
            <div class="header-content">
                <div class="logo-section">
                    <h1>🎓 أكاديمية أمين</h1>
                    <span class="version-badge">v3.0</span>
                </div>
                <div class="header-actions">
                    <a href="login.html" class="btn-login">تسجيل الدخول</a>
                    <a href="register.html" class="btn-register">إنشاء حساب</a>
                </div>
            </div>
        </header>

        <!-- المحتوى الرئيسي -->
        <main class="main-container">
            <section class="hero-section">
                <h2>🌟 منصة التعلم الذكية</h2>
                <p>تعلم بذكاء مع بوت تعليمي متطور ودروس تفاعلية</p>
                <div class="hero-stats">
                    <div class="stat-item">
                        <span class="stat-number">50+</span>
                        <span class="stat-label">درس تفاعلي</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">1000+</span>
                        <span class="stat-label">طالب مسجل</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">95%</span>
                        <span class="stat-label">رضا المستخدمين</span>
                    </div>
                </div>
            </section>

            <section class="subjects-preview">
                <h3>📚 اختر مستواك الدراسي</h3>
                <div class="grade-selector">
                    <button class="grade-btn active" data-grade="sec3" onclick="window.selectGrade('sec3')">
                        🎓 3 ثانوي (BAC)
                    </button>
                    <button class="grade-btn" data-grade="bem" onclick="window.selectGrade('bem')">
                        📖 4 متوسط (BEM)
                    </button>
                </div>
                <div id="subjectsGrid" class="subjects-grid"></div>
            </section>
        </main>

        <!-- الفوتر -->
        <footer class="main-footer">
            <p>© 2026 أكاديمية أمين - جميع الحقوق محفوظة</p>
            <div class="footer-links">
                <a href="#">سياسة الخصوصية</a>
                <a href="#">شروط الاستخدام</a>
                <a href="#">تواصل معنا</a>
            </div>
        </footer>
    </div>

    <script type="module">
        import MainApp from './js/main-app.js';
        import AuthSystem from './js/auth-system.js';
        
        // تهيئة التطبيق
        const auth = new AuthSystem();
        const app = new MainApp(auth);
        window.app = app;
        window.selectGrade = app.selectGrade.bind(app);
        
        app.init();
    </script>
</body>
</html>
