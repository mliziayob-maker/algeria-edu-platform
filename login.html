<!-- login.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - أكاديمية أمين</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🎓 أكاديمية أمين</h1>
                <p>منصة التعلم الذكية</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">📧 البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">🔒 كلمة المرور</label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="********" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember"> تذكرني
                    </label>
                    <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
                </div>
                
                <button type="submit" class="auth-btn">🚀 تسجيل الدخول</button>
                
                <div class="auth-divider">
                    <span>أو</span>
                </div>
                
                <div class="social-auth">
                    <button type="button" class="social-btn google">
                        <img src="assets/icons/google.svg" alt="Google"> Google
                    </button>
                    <button type="button" class="social-btn facebook">
                        <img src="assets/icons/facebook.svg" alt="Facebook"> Facebook
                    </button>
                    <button type="button" class="social-btn apple">
                        <img src="assets/icons/apple.svg" alt="Apple"> Apple
                    </button>
                </div>
                
                <p class="auth-footer">
                    ليس لديك حساب؟ <a href="register.html">سجل الآن</a>
                </p>
            </form>
        </div>
    </div>
    
    <script src="config/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
